{% if request.user.is_authenticated %}
<div class="modal fade" id="releaseNotesModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="releaseNotesModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="releaseNotesModalLabel">
          <i class="bi bi-stars me-1"></i> {{ release_notes_title }}
        </h5>
      </div>
      <div class="modal-body">
        <p class="mb-3">We've made several improvements. Here's what's new:</p>
        <ul class="list-unstyled mb-0">
          {% for title, detail in release_notes_features %}
          <li class="d-flex gap-3 mb-3">
            <span class="text-primary mt-1"><i class="bi bi-check-circle-fill"></i></span>
            <div>
              <div class="fw-semibold">{{ title }}</div>
              {% if detail %}<div class="text-muted small">{{ detail }}</div>{% endif %}
            </div>
          </li>
          {% endfor %}
        </ul>
      </div>
      <div class="modal-footer flex-wrap justify-content-between gap-2">
        <div class="form-check m-0">
          <input class="form-check-input" type="checkbox" id="releaseNotesDontShowAgain">
          <label class="form-check-label" for="releaseNotesDontShowAgain">Do not show this box again</label>
        </div>
        <button type="button" class="btn btn-primary" id="dismissReleaseNotesBtn">Got it</button>
      </div>
    </div>
  </div>
</div>
{% endif %}
